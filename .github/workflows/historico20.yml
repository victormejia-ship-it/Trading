name: Histórico 20 años

on:
  workflow_dispatch:
  push:
    paths:
      - "data/historico20/.solicitar"
      - ".github/workflows/historico20.yml"

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backtest.descargar data/historico20 max
      - run: |
          git config user.name "analisis-bot"
          git config user.email "analisis-bot@users.noreply.github.com"
          git add data/historico20
          git diff --cached --quiet || git commit -m "data: histórico 20 años $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
