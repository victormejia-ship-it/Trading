name: Investigación mensual

# Regenera TODA la evidencia con datos frescos de 20 años: carteras, plan, retiros, patrones y mercados del mundo.
# Corre el día 2 de cada mes (después del cierre de mes) o a mano. Publica en public/data y reports/.
on:
  schedule:
    - cron: "17 12 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investigacion
  cancel-in-progress: false

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Datos de 20 años (precios + tasas)
        run: python -m backtest.descargar data/historico20 max
      - name: Estudios
        run: |
          python -m backtest.cartera_nucleo
          python -m backtest.publicar_evidencia
          python -m backtest.plan
          python -c "from backtest.plan import carteras; carteras()"
          python -m backtest.publicar_plan
          python -m backtest.patrones
          python -m backtest.retiros
          python -m backtest.mundo
      - name: Pruebas de contratos y paridad antes de publicar
        run: python -m pytest -q tests
      - name: Publicar evidencia
        run: |
          git config user.name "analisis-bot"
          git config user.email "analisis-bot@users.noreply.github.com"
          git add data/historico20 public/data reports
          git diff --cached --quiet || git commit -m "data: investigación mensual $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
      - name: Avisar si algo falló
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: Fallo en ${{ github.workflow }}" -H "Priority: high" -H "Tags: warning" \
            -d "Revisa https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" "https://ntfy.sh/$NTFY_TOPIC" || true
