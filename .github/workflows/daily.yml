name: Analisis diario

on:
  schedule:
    # Lunes a viernes 22:17 UTC (después del cierre de NY, con margen para datos ajustados)
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      no_llm:
        description: "Ejecutar sin Claude (solo motor determinista)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: analisis-diario
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund && npm test
      - name: Worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m worker.run_daily ${{ inputs.no_llm && '--no-llm' || '' }}
      - name: Publicar JSON en el repo
        run: |
          git config user.name "analisis-bot"
          git config user.email "analisis-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: análisis $(date -u +%F)"
          git push
